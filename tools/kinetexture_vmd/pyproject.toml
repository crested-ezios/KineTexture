[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetexture-vmd"
version = "0.dev20261019"
description = "Explicit-profile VMD source inspection and compatible-local sampling preview"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {file = "LICENSE"}

[project.scripts]
kinetexture-vmd = "kinetexture_vmd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]
