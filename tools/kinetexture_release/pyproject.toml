[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kinetexture-release"
version = "0.dev20261019"
description = "File-level reviewed allowlist export and receipt verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = {file = "LICENSE"}

[project.scripts]
kinetexture-release = "kinetexture_release.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]
